<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Питомец для Аяу 🐾</title>
<style>
@property --wall{syntax:'<color>';inherits:true;initial-value:#ffeef2}
@property --floor{syntax:'<color>';inherits:true;initial-value:#f6dcc0}
@property --sky1{syntax:'<color>';inherits:true;initial-value:#9fd6ff}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#e6f6ff}
@property --tint{syntax:'<color>';inherits:true;initial-value:rgba(255,255,255,0)}
@property --stars{syntax:'<number>';inherits:true;initial-value:0}
@property --sun{syntax:'<number>';inherits:true;initial-value:1}
:root{--ink:#5a4a63;--ink2:#8f7f9b;--card:rgba(255,255,255,.74);--shadow:0 8px 24px rgba(160,120,170,.22);--pink:#ff9ec1;--lav:#cdb4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Nunito","Quicksand",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff4ec 0%,#ffe3ee 50%,#e9dcff 100%);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h2,h3,p{margin:0}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom));gap:8px}
#top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.who{display:flex;align-items:center;gap:8px;font-size:20px}
.who b{font-weight:800}
.right{display:flex;gap:8px;align-items:center}
.pill{position:relative;background:var(--card);box-shadow:var(--shadow);border-radius:22px;padding:0 14px;height:42px;font-weight:800;display:inline-flex;align-items:center;gap:6px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.round{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:20px}
.coinpop{position:absolute;right:8px;top:-4px;font-weight:800;color:#e0709a;animation:rise 1.3s ease-out forwards;pointer-events:none;--dx:0px;--dy:-30px}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border-radius:16px;padding:7px 8px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(160,120,170,.12);min-height:34px}
.stat .ico{font-size:15px}
.bar{flex:1;height:8px;border-radius:6px;background:rgba(150,110,170,.18);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ff9ec1,#ffc2d6);transition:width .6s}
.stat.low .bar i{background:linear-gradient(90deg,#ff7a8a,#ffa6a6)}
.stat.low{animation:pulse 1.4s ease-in-out infinite}
#roomWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#room{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);transition:--wall 6s,--floor 6s,--sky1 6s,--sky2 6s,--tint 6s,--stars 6s,--sun 6s;width:300px;height:333px;touch-action:manipulation}
.tod-morning{--wall:#fff0e1;--floor:#f3d9b8;--sky1:#ffd0a8;--sky2:#fff3d6;--tint:rgba(255,190,140,.10);--stars:0;--sun:1}
.tod-day{--wall:#ffeef2;--floor:#f6dcc0;--sky1:#9fd6ff;--sky2:#e6f6ff;--tint:rgba(255,255,255,0);--stars:0;--sun:1}
.tod-evening{--wall:#f9dfe6;--floor:#e8c4a8;--sky1:#ff9bb0;--sky2:#ffd3a8;--tint:rgba(255,120,110,.14);--stars:.25;--sun:.7}
.tod-night{--wall:#e5dcf0;--floor:#cdb7b6;--sky1:#27244f;--sky2:#4b3f7c;--tint:rgba(30,30,95,.38);--stars:1;--sun:0}
#roomSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wall-base{fill:var(--wall)}.floor{fill:var(--floor)}.tint{fill:var(--tint);pointer-events:none}
.sk1{stop-color:var(--sky1)}.sk2{stop-color:var(--sky2)}
.sun{opacity:var(--sun)}.moonw,.wstar{opacity:var(--stars)}
.cloud{animation:drift 22s linear infinite alternate}
.glow{opacity:0;transition:opacity 1.5s;pointer-events:none}
#room.lamp-on .glow{opacity:.95}
.bulb{animation:twinkle 2.2s ease-in-out infinite}
[data-hit]{cursor:pointer}
.ballin.bounce{animation:ballb .6s ease-in-out 4}
.teddyin.hop{animation:ballb .5s ease-in-out 2}
#pet{position:absolute;width:38%;left:30%;bottom:5%;z-index:3;pointer-events:none}
#petBody{pointer-events:auto;cursor:pointer;transform-origin:50% 92%;animation:breathe 3.2s ease-in-out infinite}
.pet-svg{width:100%;display:block;overflow:visible;transition:transform .25s}
#thought{position:absolute;top:-4%;left:50%;transform:translateX(-50%);font-size:20px;background:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none}
#thought.on{opacity:1;animation:floaty 2s ease-in-out infinite}
.fx{visibility:hidden}
[data-face=normal] .e-open,[data-face=normal] .m-smile,
[data-face=happy] .e-open,[data-face=happy] .m-big,
[data-face=sad] .e-open,[data-face=sad] .brow,[data-face=sad] .m-sad,
[data-face=sleep] .e-closed,[data-face=sleep] .m-flat,
[data-face=eat] .e-open,[data-face=eat] .m-open,
[data-face=love] .e-happy,[data-face=love] .m-big,
[data-face=yawn] .e-closed,[data-face=yawn] .m-open{visibility:visible}
.e-open{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.sleepy .e-open{animation:sleepyBlink 3s infinite}
.m-open{transform-box:fill-box;transform-origin:center}
.eating .m-open{animation:chew .35s ease-in-out infinite}
.ear-l,.ear-r,.tail{transform-box:fill-box;transform-origin:50% 90%}
.tail{transform-origin:10% 80%}
.happyst .tail{animation:wag .45s ease-in-out infinite alternate}
.wig .ear-l{animation:earL .3s ease-in-out 4}.wig .ear-r{animation:earR .3s ease-in-out 4}
.pet-body.walk,#petBody.walk{animation:waddle .5s ease-in-out infinite}
#petBody.jump{animation:jump .65s ease-out 1}
#petBody.spin{animation:spin .9s ease-in-out 1}
#petBody.sit{animation:none;transform:scale(1.03,.88)}
#petBody.lie{animation:snore 4s ease-in-out infinite;transform:translateY(6%) scale(1.04,.8)}
#petBody.shake{animation:shake .28s linear infinite}
#petBody.hug{animation:squish .5s ease-in-out 2}
#petBody.slow{animation-duration:5.5s}
.p{position:absolute;transform:translate(-50%,0);animation:rise 1.5s ease-out forwards;pointer-events:none;z-index:6;line-height:1;--dx:0px;--dy:-80px}
.p.fall{animation:fall 1s ease-in forwards}
.p.toss{animation:toss 2.4s ease-in-out forwards}
.p.still{animation:still 2.6s ease-in-out forwards}
.p.bub{animation:rise 1.8s ease-out forwards}
#fxLayer,#evLayer{position:absolute;inset:0;pointer-events:none}
#evLayer{z-index:7}
.ev{position:absolute;pointer-events:auto;font-size:30px;line-height:1;padding:8px;cursor:pointer}
.ev.butterfly{animation:fly 9s linear forwards}
.ev.star{animation:shoot 3.2s linear forwards;font-size:26px}
.ev.gift{animation:giftpop .6s ease-out,floaty 1.8s ease-in-out .6s infinite}
#bubble{position:absolute;left:50%;top:3%;transform:translate(-50%,-10px) scale(.95);max-width:88%;padding:10px 14px;background:rgba(255,255,255,.94);border-radius:18px;box-shadow:var(--shadow);font-size:14px;line-height:1.35;font-weight:700;text-align:center;opacity:0;transition:.25s;pointer-events:none;z-index:8}
#bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
#bubble:after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
#letterBtn{position:absolute;right:10px;top:22%;font-size:34px;z-index:9;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:var(--shadow);animation:floaty 1.6s ease-in-out infinite}
#actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.act{background:var(--card);border-radius:20px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px;box-shadow:0 6px 16px rgba(160,120,170,.18);font-size:11px;font-weight:800;transition:transform .12s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.act span{font-size:26px;line-height:1.1}
.act:active,.more:active,.btn:active,.buy:active{transform:scale(.93)}
#more{display:flex;gap:8px}
.more{position:relative;flex:1;height:46px;border-radius:23px;background:var(--card);font-weight:800;box-shadow:0 6px 16px rgba(160,120,170,.15);font-size:14px}
.more.sos{flex:1.6;background:linear-gradient(135deg,#ffd7e5,#e6d8ff)}
.badge{position:absolute;top:-4px;right:6px;min-width:20px;height:20px;border-radius:10px;background:#ff6f9a;color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
#sleepOv{position:fixed;inset:0;z-index:50;background:rgba(12,10,48,.62);opacity:0;pointer-events:none;transition:opacity 3.5s}
#sleepOv.on{opacity:1}
#sleepOv .moon{position:absolute;right:12%;top:9%;font-size:64px;filter:drop-shadow(0 0 20px rgba(255,240,180,.8))}
#sleepOv .star{position:absolute;color:#fff6c9;animation:twinkle 2.6s ease-in-out infinite}
#wakeBtn{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:55;background:#fff;border-radius:26px;height:52px;padding:0 26px;font-weight:800;font-size:16px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.5s}
#wakeBtn.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(80,50,90,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#sheet.open{display:flex}
.panel{position:relative;width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;background:#fffaf5;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .28s ease-out;-webkit-overflow-scrolling:touch}
.panel.full{height:100vh;height:100dvh;max-height:none;border-radius:0;display:flex;flex-direction:column}
.panel h2{font-size:22px;margin-bottom:10px;text-align:center}
.panel p{line-height:1.45;color:var(--ink2);text-align:center}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:rgba(150,110,170,.12);font-size:18px;z-index:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 24px;border-radius:25px;background:linear-gradient(135deg,#ff9ec1,#cdb4ff);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 18px rgba(200,130,190,.35);transition:transform .12s}
.btn.ghost{background:rgba(150,110,170,.14);color:var(--ink);box-shadow:none}
.btn.big{height:58px;font-size:18px;padding:0 40px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -4px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;height:40px;padding:0 14px;border-radius:20px;background:rgba(150,110,170,.12);font-weight:800;font-size:14px}
.tab.on{background:linear-gradient(135deg,#ff9ec1,#cdb4ff);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#fff;border-radius:20px;padding:12px 10px;text-align:center;box-shadow:0 4px 14px rgba(160,120,170,.14);display:flex;flex-direction:column;align-items:center;gap:4px}
.item.on{outline:2px solid #ffb3cf}
.item .ic{font-size:38px;line-height:1.2}
.item small{color:var(--ink2);font-size:12px;line-height:1.25;min-height:30px}
.buy{margin-top:4px;height:42px;min-width:100px;padding:0 14px;border-radius:21px;background:#ffe3ee;font-weight:800}
.buy.ok{background:#e6f6e9}.buy.poor{opacity:.55}
.tag{margin-top:4px;height:42px;display:grid;place-items:center;font-weight:800;color:#6fb08b}
.task{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:8px;box-shadow:0 4px 12px rgba(160,120,170,.12)}
.task .ti{font-size:26px}.task .tt{flex:1;font-weight:700;font-size:14px}
.task .pg{height:6px;border-radius:4px;background:rgba(150,110,170,.18);margin-top:6px;overflow:hidden}
.task .pg i{display:block;height:100%;background:linear-gradient(90deg,#ff9ec1,#cdb4ff)}
.task .buy{min-width:84px;margin:0}
.set{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:8px;font-weight:700;gap:10px}
.set input{flex:1;min-width:0;height:40px;border:2px solid #f2d9e6;border-radius:14px;padding:0 12px;font:inherit;color:var(--ink);background:#fffafc;-webkit-user-select:text;user-select:text}
.sw{width:56px;height:32px;border-radius:16px;background:#ddd0e8;position:relative;transition:.2s;flex:0 0 auto}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#ff9ec1}.sw.on:after{left:27px}
.letter{background:#fff;border-radius:20px;padding:22px 18px;box-shadow:0 8px 24px rgba(160,120,170,.2);margin:6px 0;font-size:17px;line-height:1.55;color:var(--ink);font-weight:700;text-align:center;animation:letterIn .7s ease-out}
.env{font-size:56px;text-align:center;animation:floaty 2s ease-in-out infinite}
.gm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;text-align:center;padding:20px}
.gm .best{font-weight:800;color:#e0709a}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:6px 52px 10px 4px;font-size:18px;font-weight:800}
#gArea{position:relative;flex:1;background:linear-gradient(180deg,#fff0f6,#efe6ff);border-radius:24px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.tg{position:absolute;width:62px;height:62px;border-radius:50%;font-size:36px;display:grid;place-items:center;background:rgba(255,255,255,.7);box-shadow:0 6px 16px rgba(220,120,160,.3);animation:tgin 1.7s linear forwards;touch-action:none}
.tg.gold{background:#fff1b8}.tg.cloud{background:#e8eef8}
.tg.pop{animation:tgpop .2s ease-out forwards}
.gpop{position:absolute;font-weight:800;font-size:22px;color:#e0709a;animation:rise .8s ease-out forwards;pointer-events:none;--dx:0px;--dy:-40px}
#care{position:fixed;inset:0;z-index:70;display:none;overflow:auto;background:linear-gradient(180deg,#fdf0ff,#fff4ec 60%,#e8f1ff)}
#care.open{display:block;animation:fade .7s}
.care-in{position:relative;max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));text-align:center}
.care-pet{position:relative;width:190px;margin:26px auto 4px;animation:calmB 5s ease-in-out infinite}
.care-msg{font-size:19px;font-weight:800;margin:10px 0 16px;line-height:1.4}
.card{background:rgba(255,255,255,.8);border-radius:24px;padding:18px 16px;box-shadow:var(--shadow);margin-bottom:14px;text-align:left}
.card h3{font-size:18px;text-align:center}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-radius:14px;line-height:1.4;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.tip i{font-style:normal;font-size:22px}
.tip.done{opacity:.5;text-decoration:line-through}
.tip.done:after{content:"✓";margin-left:auto;color:#6fb08b;font-weight:800}
.warn{margin-top:10px;padding:12px;border-radius:16px;background:#fff1e0;font-size:14px;line-height:1.45;font-weight:600}
.breath{width:140px;height:140px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,#fff,#ffd3e4 60%,#e0d2ff);display:grid;place-items:center;font-weight:800;animation:breath 10s ease-in-out infinite;box-shadow:0 0 40px rgba(255,170,200,.6)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-80px);z-index:100;background:#fff;border-radius:20px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:var(--shadow);transition:.35s;max-width:90%;text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
#onboard{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#fff4ec,#ffe3ee 55%,#e9dcff);overflow:auto}
.ob{max-width:440px;width:100%;text-align:center}
.ob h1{font-size:26px;margin:0 0 8px}
.ob p{color:var(--ink2);line-height:1.5;margin:0 0 18px}
.choose{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.pc{background:var(--card);border-radius:22px;padding:10px 4px 12px;box-shadow:var(--shadow);border:3px solid transparent;font-weight:800;transition:.2s}
.pc.on{border-color:#ff9ec1;transform:translateY(-4px);background:#fff}
.pc .pv{width:80%;margin:0 auto 4px;display:block}
.pc .pv .pet-svg{animation:floaty 3s ease-in-out infinite}
.ob input{width:100%;height:56px;border-radius:20px;border:3px solid #f2d9e6;font:inherit;font-size:20px;font-weight:800;text-align:center;color:var(--ink);background:#fff;margin-bottom:12px;-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.chip{height:40px;padding:0 14px;border-radius:20px;background:rgba(255,255,255,.8);font-weight:800}
.ob .big-pet{width:150px;margin:0 auto 10px}
.coin-s{display:inline-block}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes snore{0%,100%{transform:translateY(6%) scale(1.04,.8)}50%{transform:translateY(6%) scale(1.05,.83)}}
@keyframes waddle{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%,60%{transform:translateY(-34px) scale(.97,1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes squish{50%{transform:scale(1.07,.93)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes sleepyBlink{0%,100%{transform:scaleY(.4)}40%{transform:scaleY(.15)}60%{transform:scaleY(.5)}}
@keyframes chew{50%{transform:scaleY(.45)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes earL{50%{transform:rotate(-10deg)}}
@keyframes earR{50%{transform:rotate(10deg)}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(1.1)}}
@keyframes fall{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:1;transform:translate(-50%,var(--dy))}}
@keyframes toss{0%{opacity:0;transform:translate(-50%,0)}10%{opacity:1}30%{transform:translate(-30px,-70px)}50%{transform:translate(-10px,0)}70%{transform:translate(20px,-40px)}90%{transform:translate(40px,0);opacity:1}100%{transform:translate(50px,0);opacity:0}}
@keyframes still{0%{opacity:0}20%,80%{opacity:1}100%{opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#thought.on{animation:thoughtf 2s ease-in-out infinite}
@keyframes thoughtf{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes ballb{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
@keyframes fly{0%{left:-8%;top:40%;opacity:0}10%{opacity:1}25%{top:25%}50%{top:48%}75%{top:30%}100%{left:105%;top:42%;opacity:1}}
@keyframes shoot{0%{left:90%;top:4%;opacity:0}10%{opacity:1}100%{left:5%;top:34%;opacity:0}}
@keyframes giftpop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes letterIn{from{transform:translateY(20px) scale(.95);opacity:0}to{transform:none;opacity:1}}
@keyframes tgin{0%{transform:scale(.3);opacity:0}12%{transform:scale(1);opacity:1}85%{opacity:1}100%{transform:scale(.8);opacity:0}}
@keyframes tgpop{to{transform:scale(1.5);opacity:0}}

<script>
(function(){
'use strict';

/* ================= 0. УТИЛИТЫ ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* ================= 1. СОСТОЯНИЕ ИГРЫ ================= */
const KEY='ayauPetV1';
const PETS={
  dog:{label:'Собачка',emoji:'🐶',body:'#f1d3ac',belly:'#fff1de',ear:'#c99763'},
  cat:{label:'Котёнок',emoji:'🐱',body:'#cfc3df',belly:'#f4eefb',ear:'#a99bc2'},
  rabbit:{label:'Зайчик',emoji:'🐰',body:'#fffaf6',belly:'#ffffff',ear:'#f7d9e3'}
};
function defaults(){return{v:1,pet:null,name:'',stats:{mood:80,food:80,energy:90,clean:90},coins:20,
  owned:{bed0:1,wall0:1},placed:{bed0:1,wall0:1},best:0,games:0,created:Date.now(),lastSeen:Date.now(),
  lastDay:'',streak:0,days:0,tasks:{date:'',c:{},claimed:{}},letters:{read:[],last:0,count:0,pending:null},
  secrets:{},sound:false,sleeping:false,lastAuto:0};}
let S=defaults();

/* ================= 2. СОХРАНЕНИЕ / ЗАГРУЗКА ================= */
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return;
    const p=JSON.parse(raw), base=defaults();
    S=Object.assign(defaults(),p);
    S.stats=Object.assign(base.stats,p.stats||{});
    S.owned=Object.assign({bed0:1,wall0:1},p.owned||{});
    S.placed=Object.assign({bed0:1,wall0:1},p.placed||{});
    S.tasks=Object.assign({date:'',c:{},claimed:{}},p.tasks||{});
    S.letters=Object.assign({read:[],last:0,count:0,pending:null},p.letters||{});
    S.secrets=p.secrets||{};
    if(!PETS[S.pet]) S.pet=null;
  }catch(e){}
}
function save(){
  S.lastSeen=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}
function applyOffline(){
  const away=(Date.now()-S.lastSeen)/3600000;
  if(away<0.02) return away;
  const h=Math.min(away,10), k=0.6, st=S.stats;
  const floorv=(v,f)=>Math.max(Math.min(v,f),v);
  if(S.sleeping){
    st.energy=clamp(st.energy+h*60);
    st.food=clamp(st.food-6*h*k);
    S.sleeping=false;
  }else{
    st.food=Math.max(Math.min(st.food,12),st.food-18*h*k);
    st.energy=Math.max(Math.min(st.energy,12),st.energy-12*h*k);
    st.clean=Math.max(Math.min(st.clean,15),st.clean-10*h*k);
    st.mood=Math.max(Math.min(st.mood,15),st.mood-14*h*k);
  }
  return away;
}

/* ================= ЗВУК / ТОСТ ================= */
let AC=null;
function sfx(k){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const seq={tap:[[660,.08]],coin:[[880,.07],[1320,.1]],eat:[[300,.06],[360,.06],[330,.06]],ok:[[523,.08],[659,.08],[784,.12]],bad:[[220,.15]]}[k]||[];
    let at=AC.currentTime;
    seq.forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.06,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+d);
      o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d+.02);at+=d*.9;
    });
  }catch(e){}
}
let toastT;
function toast(msg,ms=2200){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms);
}

/* ================= 8. СООБЩЕНИЯ ================= */
const MSG={
  chat:['Аяу, ты сегодня покушала? 🥺','Мне кажется, тебе пора немного отдохнуть.','Я скучал!','Пойдём играть?','Ты сегодня выглядишь счастливой. Мне нравится.','Не забудь попить воды 💧','Потянись немножко! Вот так… 🙆','Расскажешь, как прошёл твой день?','Я просто посижу рядом, ладно?','Ты у меня молодец. Я это вижу.','Если устала — приляг на минутку.','Хочешь секрет? Тыкай во всё подряд 👀'],
  own:{dog:['Гав! 🐾','*виляет хвостиком*','Хочу гулять! …хотя тут и так уютно.'],cat:['Мур-мур 😸','*щурится и мурлычет*','Я тут главный. Шучу. Ну почти.'],rabbit:['*морщит носик*','*тихонько хрустит морковкой*','Тук-тук лапкой!']},
  thoughts:['Интересно, что там за окном?','Ой, пылинка! …нет, показалось 👀','Хочу печеньку. Нет, просто хочу ☺️','Тут так уютно ✨','А вдруг в комнате есть секреты?'],
  morning:['Доброе утро! Как спалось? ☀️','Утро! Давай начнём день с чего-то хорошего.','Мне снился вкусный сон 🍗'],
  day:['Какой день! Хочется играть 🌤️','Днём в комнате так светло!','Поиграем? Я уже наготове!'],
  evening:['Вечереет… Я немножко сонный 🌆','Какой красивый закат за окном!','Вечером особенно уютно.'],
  night:['Ночью уютно. Но тебе пора спать, Аяу 🌙','Звёздочки за окном! ✨','Пора потихоньку отдыхать… 🌙'],

const SPOTS={bath:{l:27,b:27},feed:{l:31,b:28},bed:{l:0,b:19},left:{l:10,b:5},mid:{l:30,b:5},bowl:{l:60,b:5},toy:{l:36,b:4},window:{l:31,b:8},plant:{l:48,b:7}};
let curSpot='mid',lastL=30;
function setPetPos(name,instant){
  const sp=SPOTS[name]||SPOTS.mid, el=$('#pet');
  if(instant) el.style.transition='none';
  el.style.left=sp.l+'%'; el.style.bottom=sp.b+'%'; curSpot=name; lastL=sp.l;
  if(instant){void el.offsetWidth; el.style.transition='';}
}
function walkTo(name){
  const sp=SPOTS[name]||SPOTS.mid, el=$('#pet');
  const curL=parseFloat(el.style.left)||30, curB=parseFloat(el.style.bottom)||5;
  const dist=Math.abs(sp.l-curL)+Math.abs(sp.b-curB)*.5;
  const slow=S.stats.mood<30?1.7:1;
  const dur=(dist<2?.2:(.5+dist/28))*slow;
  el.style.transition=`left ${dur}s ease-in-out,bottom ${dur}s ease-in-out`;
  el.style.left=sp.l+'%'; el.style.bottom=sp.b+'%';
  const svg=mainSvg();
  if(svg&&Math.abs(sp.l-curL)>2) svg.style.transform=sp.l<curL?'scaleX(-1)':'scaleX(1)';
  curSpot=name; lastL=sp.l;
  if(dist>=2){petBody().classList.add('walk');setTimeout(()=>petBody().classList.remove('walk'),dur*1000);}
  return wait(dur*1000+60);
}
function headPos(){
  const el=$('#pet');

function fx(emoji,x,y,o={}){
  const l=$('#fxLayer'), e=document.createElement('span');
  e.className='p '+(o.cls||''); e.textContent=emoji;
  e.style.left=x+'%'; e.style.top=y+'%';
  e.style.setProperty('--dx',(o.dx!==undefined?o.dx:rnd(-30,30))+'px');
  e.style.setProperty('--dy',(o.dy!==undefined?o.dy:-80)+'px');
  e.style.fontSize=(o.size||22)+'px';
  e.style.animationDuration=(o.dur||1.5)+'s';

  const a=$('#gArea'); if(!a) return;
  const r=Math.random(), type=r<.14?'gold':r<.32?'cloud':'heart';
  const b=document.createElement('button');
  b.className='tg '+type; b.textContent=type==='gold'?'🐾':type==='cloud'?'☁️':'💗';
  const w=a.clientWidth, h=a.clientHeight, size=62;
  b.style.left=rnd(6,Math.max(8,w-size-6))+'px'; b.style.top=rnd(6,Math.max(8,h-size-6))+'px';
  const life=type==='gold'?1100:1700;
  b.style.animationDuration=life+'ms';
  b.addEventListener('pointerdown',ev=>{ev.preventDefault();hitTarget(b,type);});
  a.appendChild(b); setTimeout(()=>b.remove(),life);
}
function hitTarget(b,type){
  if(!b.isConnected||b.dataset.h) return; b.dataset.h=1;
  const v=type==='gold'?3:type==='cloud'?-2:1;
  G.score=Math.max(0,G.score+v);
  const a=$('#gArea'), p=document.createElement('span');
  p.className='gpop'; p.textContent=(v>0?'+':'')+v; p.style.left=b.style.left; p.style.top=b.style.top;
  if(a) a.appendChild(p); setTimeout(()=>p.remove(),850);
  b.classList.add('pop'); setTimeout(()=>b.remove(),200);
  const s=$('#gS'); if(s) s.textContent=G.score;
  sfx(v>0?'tap':'bad');
}
function stopGame(){G.on=false;clearInterval(G.tick);clearTimeout(G.spawn);}
function finishGame(){
  if(!G.on) return; stopGame();
  const sc=G.score, coins=Math.min(3+Math.floor(sc/3),25);
  const newBest=sc>S.best; if(newBest) S.best=sc;
  S.games++; S.coins+=coins;
  addStat('mood',Math.min(25,8+Math.floor(sc/2))); addStat('energy',5); addStat('food',-4);
  bump('game'); renderAll(); save(); sfx('ok');
  setPanel(`<div class="gm"><button class="x" data-act="close">✕</button><div style="font-size:64px">🐾</div><h2>Ты набрала ${sc} очков! 🐾</h2><p>Награда: <b>+${coins} 🐾</b>${newBest&&sc>0?'<br>🎉 Новый рекорд!':''}<br>${esc(S.name)} в восторге!</p><div class="best">Рекорд: ${S.best}</div><div class="row"><button class="btn" data-act="game-start">Ещё раз</button><button class="btn ghost" data-act="close">Вернуться</button></div></div>`);
  setTimeout(()=>{faceFor('happy',3000);burst('💗',5);say(sc>=20?'Вот это да! Ты чемпионка! 🏆':'Было весело! Ещё разок? 🎮');},300);
}

/* ================= 10. РЕЖИМ «МНЕ ПЛОХО» ================= */
let breathT=null;
const TIPS=[
  ['♨️','Тепло на низ живота — грелка или тёплое полотенце через ткань, чтобы не обжечь кожу.'],
  ['🚿','Тёплый душ или ванна — тепло помогает мышцам расслабиться.'],
  ['💧','Пей воду или тёплый чай небольшими глотками.'],
  ['🛌','Отдых — ляг поудобнее, можно подтянуть колени к животу.'],
  ['🚶','Лёгкое движение или растяжка — только если комфортно, без усилий.'],
  ['💊','Безрецептурное обезболивающее — по инструкции на упаковке и только если оно тебе подходит. Если сомневаешься, спроси врача или фармацевта.']
];
function openCare(){
  const el=$('#care');
  el.innerHTML=`<div class="care-in">
    <button class="x" data-act="care-close" aria-label="Закрыть">✕</button>
    <div class="care-pet" id="carePet">${petSVG(S.pet)}</div>
    <p class="care-msg" id="careMsg">Иди сюда. Сегодня я буду заботиться о тебе 🤍</p>
    <div class="card" id="careCard"><h3>Начались боли?</h3><div class="row"><button class="btn" data-act="pain-yes">Да</button><button class="btn ghost" data-act="pain-no">Нет</button></div></div>
    <div id="careMore"></div>
    <div class="row"><button class="btn ghost" data-act="hug-care">🫂 Обнять</button><button class="btn" data-act="care-close">Мне лучше</button></div>
  </div>`;
  const svg=$('#carePet svg'); applyAcc(svg); svg.setAttribute('data-face','love');
  el.classList.add('open'); el.scrollTop=0;
}
function closeCare(){
  clearInterval(breathT); breathT=null;
  $('#care').classList.remove('open'); $('#care').innerHTML='';
  addStat('mood',5); renderAll(); save();
  say('Я рядом, если что 🤍',5000);
}
function painYes(){
  $('#careMsg').textContent='Мне очень жаль 🤍 Давай попробуем немного помочь.';
  $('#careCard').innerHTML=`<h3>Что может помочь</h3><p style="text-align:center;color:var(--ink2);font-size:13px;margin:4px 0 6px">Нажимай на то, что уже попробовала</p>
  ${TIPS.map(t=>`<div class="tip" data-act="tip"><i>${t[0]}</i><span>${t[1]}</span></div>`).join('')}
  <div class="warn">⚠️ Если боль необычно сильная, внезапная, значительно отличается от обычной или сопровождается тревожными симптомами, стоит обратиться за медицинской помощью.</div>`;
  $('#careMore').innerHTML='';
}
function painNo(){
  $('#careMsg').textContent='Хорошо 🤍 Тогда просто побудем вместе.';
  $('#careCard').innerHTML=`<h3>Давай подышим вместе</h3><div class="breath" id="breathTxt">Вдох…</div><p style="text-align:center;color:var(--ink2);font-size:14px">Медленно вдыхай носом, медленно выдыхай ртом.</p><div class="row"><button class="btn ghost" data-act="pain-yes">Всё-таки покажи советы</button></div>`;
  clearInterval(breathT);
  const tick=()=>{
    const t=$('#breathTxt'); if(!t){clearInterval(breathT);return;}
    t.textContent='Вдох…'; setTimeout(()=>{const x=$('#breathTxt'); if(x) x.textContent='Выдох…';},4000);
  };
  tick(); breathT=setInterval(tick,10000);
}
function hugCare(){
  const lines=['Я рядом.','Дыши медленно. Я никуда не уйду.','Ты справляешься 🤍','Тёплые обнимашки отправлены 🫂'];
  $('#careMsg').textContent=pick(lines);
  const holder=$('#carePet'); if(!holder) return;
  for(let i=0;i<6;i++){
    const s=document.createElement('span'); s.textContent=pick(['💗','🤍','💞']);
    s.style.cssText=`position:absolute;left:${rnd(10,80)}%;top:${rnd(20,60)}%;font-size:${rnd(20,30)}px;animation:rise 1.6s ease-out forwards;animation-delay:${i*.12}s;--dx:${rnd(-20,20)}px;--dy:-70px;opacity:0`;
    holder.appendChild(s); setTimeout(()=>s.remove(),2200);
  }
  addStat('mood',4);
}

/* ================= НАСТРОЙКИ / ЗАДАНИЯ ================= */
function tasksHTML(){
  ensureTasks();
  const rows=TASKS.map(t=>{
    const c=Math.min(S.tasks.c[t.id]||0,t.n), done=c>=t.n, cl=S.tasks.claimed[t.id];
    const btn=cl?`<span class="tag" style="min-width:84px">Получено ✓</span>`:done?`<button class="buy ok" data-act="claim" data-id="${t.id}">+${t.r} 🐾</button>`:`<span style="min-width:84px;text-align:center;font-weight:800;color:var(--ink2)">${c}/${t.n}</span>`;
    return `<div class="task"><div class="ti">${t.ico}</div><div class="tt">${t.t}<div class="pg"><i style="width:${c/t.n*100}%"></i></div></div>${btn}</div>`;
  }).join('');
  return `<button class="x" data-act="close">✕</button><h2>Задания на сегодня 📋</h2>${rows}<p style="margin-top:8px;font-size:13px">Новые задания появятся завтра 🌙</p>`;
}
function settingsHTML(){
  const n=Object.keys(S.secrets).length;
  return `<button class="x" data-act="close">✕</button><h2>Настройки ⚙️</h2>
  <div class="set"><span>Звуки</span><button class="sw ${S.sound?'on':''}" data-act="sound" aria-label="Звуки"></button></div>
  <div class="set"><input id="renameIn" maxlength="14" value="${esc(S.name)}" aria-label="Имя питомца"><button class="btn" style="height:40px;padding:0 16px" data-act="rename">Имя</button></div>
  <div class="set"><span>Секретов найдено</span><b>${n} / ${SECRETS.length}</b></div>
  <div class="set"><span>Письма от Игоря</span><b>${S.letters.count} 💌</b></div>
  <div class="set"><span>Лучший счёт в игре</span><b>${S.best}</b></div>
  <div class="row"><button class="btn ghost" id="resetBtn" data-act="reset">Начать заново</button></div>
  <p style="margin-top:14px;font-size:13px">Сделано специально для Аяу 🤍</p>`;
}
let resetArmed=false;

/* ================= ОБРАБОТКА НАЖАТИЙ ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case 'feed': sfx('tap'); act(doFeed); break;
    case 'pet': petTap(); break;
    case 'play': sfx('tap'); act(doPlay); break;
    case 'wash': sfx('tap'); act(doWash); break;
    case 'sleep': sfx('tap'); act(doSleep); break;
    case 'wake': wake(); break;
    case 'bath-rinse': rinse(); break;
    case 'bath-out': exitBath(); break;
    case 'tray-close': closeTray(); break;
    case 'shop': openShop(); break;
    case 'tasks': openSheet(tasksHTML()); break;
    case 'settings': resetArmed=false; openSheet(settingsHTML()); break;
    case 'game': openGame(); break;
    case 'game-start': startGameRound(); break;
    case 'care': openCare(); break;
    case 'care-close': closeCare(); break;
    case 'pain-yes': painYes(); break;
    case 'pain-no': painNo(); break;
    case 'hug-care': hugCare(); break;
    case 'tip': t.classList.toggle('done'); sfx('tap'); break;
    case 'close': closeSheet(); break;
    case 'shop-tab': shopTab=id; setPanel(shopHTML()); break;
    case 'buy': buy(id); break;
    case 'place': place(id); break;
    case 'letter': openLetter(); break;
    case 'letter-ok': letterOk(); break;
    case 'claim': {
      const task=TASKS.find(x=>x.id===id);
      if(task&&(S.tasks.c[id]||0)>=task.n&&!S.tasks.claimed[id]){
        S.tasks.claimed[id]=1; addCoins(task.r); setPanel(tasksHTML()); renderTaskBadge(); save();
      }
      break;
    }
    case 'sound': S.sound=!S.sound; t.classList.toggle('on',S.sound); sfx('ok'); save(); break;
    case 'rename': {
      const v=($('#renameIn').value||'').trim().slice(0,14);
      if(v){S.name=v;$('#petName').textContent=v;document.title=v+' 🐾';save();toast('Имя сохранено 🐾');}
      break;
    }
    case 'reset':
      if(!resetArmed){resetArmed=true;t.textContent='Точно? Нажми ещё раз';setTimeout(()=>{resetArmed=false;if(t.isConnected)t.textContent='Начать заново';},4000);}
      else{try{localStorage.removeItem(KEY);}catch(err){} S=defaults(); location.reload();}
      break;
  }
});

/* ================= ЖЕСТЫ ПО КОМНАТЕ ================= */
let nameTaps=[],coinTaps=[];
function bindRoom(){
  const body=petBody();
  body.addEventListener('click',()=>{if(bath.on) return;if(pressFired){pressFired=false;return;}petTap();});
  body.addEventListener('pointerdown',()=>{
    if(bath.on) return;
    pressFired=false; clearTimeout(pressT);
    pressT=setTimeout(()=>{pressFired=true;hugPet();},800);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>body.addEventListener(ev,()=>clearTimeout(pressT)));
  bindBath(body);
  $('#roomSvg').addEventListener('click',e=>{
    const h=e.target.closest('[data-hit]'); if(!h) return;
    const k=h.dataset.hit;
    if(k==='window'){
      secret('window','выглянула в окно');
      if(tod==='night'){fx('✨',48,14,{dur:2,dy:-20});say('Звёздочки мерцают ✨');}
      else{const bd=document.createElement('span');spawnEvent('🐦','butterfly',()=>{addCoins(1);say('Птичка! 🐦');},9000);say(pick(MSG.window));}
    }else if(k==='plant'){
      secret('plant','полила растение');
      fx('🌸',82,66,{dur:1.6});fx('🌱',82,72,{dur:1.6,delay:.2});say('Растение растёт! 🌱');
    }else if(k==='rug'){
      secret('rug','танцы на ковре');
      if(!busy&&!S.sleeping) act(async()=>{await walkTo('mid');faceFor('happy',2500);const b=petBody();b.classList.add('spin');burst('🎵',4);await wait(1000);b.classList.remove('spin');say('Танцуем! 💃');});
    }else if(k==='frame'){
      secret('frame','рамка с лапкой');say('Здесь отпечаток моей лапки 🐾');
    }else if(k==='lamp'){
      const eff=$('#room').classList.contains('lamp-on');lampManual=!eff;renderGlow();say('Щёлк! 💡',1800);sfx('tap');
    }else if(k==='teddy'){
      say('Тедди — мой лучший друг 🧸');burst('🧸',1);
    }else if(k==='ball'){
      const b=$('#it-ball .ballin');b.classList.add('bounce');setTimeout(()=>b.classList.remove('bounce'),2600);
    }else if(k==='bowl'){
      say(S.stats.food<50?'Миска ждёт вкусняшек 🍗':'Пока не голоден 😌');
    }
  });
  $('#petName').addEventListener('click',()=>{
    const n=Date.now(); nameTaps=nameTaps.filter(t=>n-t<4000); nameTaps.push(n);
    if(nameTaps.length>=5){nameTaps=[];secret('name5');say('Ты уже лучше, чем думаешь 🤍',5000);}
  });
  $('#coinBtn').addEventListener('click',()=>{
    const n=Date.now(); coinTaps=coinTaps.filter(t=>n-t<5000); coinTaps.push(n);
    if(coinTaps.length>=7){coinTaps=[];if(secret('coins7','лапки')) say('Тайные лапки! 🐾');else toast('Лапок много не бывает 🐾');}
  });
  $$('#stats .stat').forEach(el=>el.addEventListener('click',()=>{
    const s=STATS.find(x=>x.k===el.dataset.stat);
    toast(`${s.ico} ${s.n}: ${Math.round(S.stats[s.k])}/100`,1600);
  }));
}

/* ================= ГЛАВНЫЙ ЦИКЛ ================= */
let sec=0,nextSpeak=0,nextEvent=0,started=false;
function loop(){
  sec++;
  const now=Date.now();
  if(S.sleeping){
    S.stats.energy=clamp(S.stats.energy+3.2); S.stats.mood=clamp(S.stats.mood+.2); S.stats.food=clamp(S.stats.food-.02);
    if(sec%3===0){const p=headPos();fx('💤',p.x+8,p.y-4,{dur:2.4,dx:14,dy:-60,size:20});}
    if(S.stats.energy>=100) wake('Выспался! Я полон сил ⚡');
  }else if(sec%10===0){
    decay(10);
    if(tod==='night'&&S.stats.energy<28&&!busy&&now-S.lastAuto>30*60*1000&&!$('#care').classList.contains('open')&&!sheet.classList.contains('open')){
      S.lastAuto=now; busy=true; idleToken++;
      walkTo('bed').then(()=>{busy=false;if(!S.sleeping)startSleep(true);});
    }
  }
  if(sec%30===0){updateTod();save();}
  if(!S.sleeping&&now>nextSpeak){nextSpeak=now+rnd(26000,46000);autoSpeak();}
  if(now>nextEvent){nextEvent=now+rnd(15000,30000);randomEvents();}
  renderStats(); renderPetState();
}

/* ================= ЗАПУСК ================= */
function startGame(intro){
  $('#onboard').hidden=true; $('#app').hidden=false;
  buildStats(); buildRoom(); fitRoom(); bindRoomOnce();
  $('#petName').textContent=S.name; document.title=S.name+' 🐾';
  petBody().innerHTML=petSVG(S.pet);
  const away=intro?0:applyOffline();
  ensureTasks(); updateTod(true); renderRoomItems(); renderAll();
  setPetPos(S.sleeping?'bed':'mid',true);
  if(S.sleeping) applySleepVisual();
  nextSpeak=Date.now()+9000; nextEvent=Date.now()+20000;
  if(S.letters.pending!==null) $('#letterBtn').hidden=false;
  if(!intro){
    const bonus=dailyCheck(away);
    if(!bonus&&away>0.5) say(pick(MSG.back),6000);
    else if(!bonus) say(pick(MSG[tod]),4500);
  }else{
    const b=petBody(); b.classList.add('jump');
    setTimeout(()=>{b.classList.remove('jump');say(`Привет! Меня зовут ${S.name}. А ты — Аяу, да? 🐾`,6000);burst('💗',5);},700);
  }
  if(!started){started=true;setInterval(loop,1000);idleLoop();}
  save();
}
let roomBound=false;
function bindRoomOnce(){if(roomBound)return;roomBound=true;bindRoom();}

/* --- первый запуск --- */
const SUGGEST=['Мочи','Пушок','Лаки','Зефирка','Бублик','Ириска','Моти','Облачко'];
function showOnboard(){
  const ob=$('#onboard'); ob.hidden=false; $('#app').hidden=true;
  let chosen=null;
  ob.innerHTML=`<div class="ob"><h1>Привет, Аяу 🐾</h1><p>У тебя появился маленький друг.<br>Кого выберешь?</p>
  <div class="choose">${Object.keys(PETS).map(k=>`<button class="pc" data-pet="${k}"><div class="pv">${petSVG(k)}</div>${PETS[k].emoji} ${PETS[k].label}</button>`).join('')}</div>
  <button class="btn big" id="obNext" style="opacity:.5">Дальше</button></div>`;
  $$('.pc',ob).forEach(b=>{
    const sv=$('svg',b); sv.setAttribute('data-face','happy');
    b.addEventListener('click',()=>{
      chosen=b.dataset.pet; $$('.pc',ob).forEach(x=>x.classList.toggle('on',x===b)); $('#obNext').style.opacity=1; sfx('tap');
    });
  });
  $('#obNext').addEventListener('click',()=>{
    if(!chosen){toast('Выбери малыша 🐾');return;}
    nameStep(chosen);
  });
}
function nameStep(type){
  const ob=$('#onboard');
  ob.innerHTML=`<div class="ob"><div class="big-pet">${petSVG(type)}</div><h1>Как назовём твоего малыша?</h1>
  <input id="obName" maxlength="14" placeholder="Например, ${pick(SUGGEST)}" autocomplete="off">
  <div class="chips">${SUGGEST.slice(0,6).map(n=>`<button class="chip" data-n="${n}">${n}</button>`).join('')}</div>
  <button class="btn big" id="obGo">Познакомиться 🐾</button></div>`;
  const sv=$('.big-pet svg',ob); sv.setAttribute('data-face','love');
  $$('.chip',ob).forEach(c=>c.addEventListener('click',()=>{$('#obName').value=c.dataset.n;}));
  $('#obGo').addEventListener('click',()=>{
    const name=($('#obName').value||'').trim().slice(0,14)||pick(SUGGEST);
    S=defaults(); S.pet=type; S.name=name;
    S.lastDay=dayKey(new Date()); S.days=1; S.streak=1; S.created=Date.now();
    save(); startGame(true);
  });
}

window.addEventListener('resize',fitRoom);
window.addEventListener('orientationchange',()=>setTimeout(fitRoom,200));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();return;}
  if(!S.pet||$('#app').hidden) return;
  const away=applyOffline();
  if(away>0.02){
    S.lastSeen=Date.now(); renderAll();
    if(!S.sleeping){setPetPos('mid');}
    else{wake();}
    if(away>0.5) say(pick(MSG.back),6000);
    updateTod(true);
    dailyCheck(away);
  }
  fitRoom();
});
window.addEventListener('pagehide',save);

load();
if(S.pet) startGame(false); else showOnboard();
})();
</script>
